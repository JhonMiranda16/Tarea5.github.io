<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x=parseInt(prompt("Ingrese su edad"))
        
        if(x>=18)
        {
            document.write("<h1>Tu eres mayor de edad en el Perú</h>");
        } else 
        {
            document.write("<h1>Tu eres menor de edad</h>");
            
        }
    </script>
</body>
</html>
